[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "ovael-backend"
version = "1.0.0"
description = "OVAEL adaptive teaching companion, gap detection, grounded knowledge, memory and MCP backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
  "Pillow>=10,<13",
  "argon2-cffi>=23,<26",
  "PyJWT>=2.8,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "matplotlib>=3.9,<4",
  "mcp>=2,<3",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13,<1"]
local-model = [
  "torch>=2.4",
  "transformers>=4.50",
]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
